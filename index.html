<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071225"><title>Legends of Eldoria</title><link rel="stylesheet" href="battle-ui.css?v=20261024-1"><link rel="stylesheet" href="combat-actions.css?v=20261024-2"><link rel="stylesheet" href="ceo-panel.css?v=20261023-3"><link rel="stylesheet" href="characters.css?v=20261023-1"><link rel="stylesheet" href="dnd-attributes.css?v=20261023-1"><link rel="stylesheet" href="attribute-training.css?v=20261023-1"><link rel="stylesheet" href="inventory-ui.css?v=20261023-2"><style>:root{--bg:#07090c;--panel:#0d1015;--line:#202631;--text:#f3f5f7;--muted:#89919d;--gold:#d79a2b;--red:#dc4053}*{box-sizing:border-box}html,body{margin:0;background:#050608;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}button,input{font:inherit}.site{max-width:1500px;margin:auto;min-height:100vh;background:var(--bg)}.banner{height:clamp(220px,37.5vw,562px);position:relative;background:#090a0d url('banner.png') 50% 48%/cover no-repeat;border-bottom:1px solid #15191f}.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent 16%)}.topStats{position:absolute;right:18px;top:18px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}.stat{background:#080a0de8;border:1px solid #252b34;padding:7px 10px;border-radius:8px;font-size:12px}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:650px}.side{background:#090b0e;border-right:1px solid #171b21;padding:18px 12px}.sideTitle{padding:10px 11px 7px;color:#626b77;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.nav{display:grid;gap:3px}.nav button{width:100%;border:0;background:transparent;text-align:left;color:#a8afb9;padding:10px 11px;border-radius:8px;cursor:pointer;font-weight:600}.nav button:hover{background:#11151a;color:#fff}.nav button:first-child{background:#1 px}.form input{padding:11px;background:#080a0c;border:1px solid #222831;color:#fff;border-radius:8px}.enemy{text-align:center}.enemy .monster{font-size:70px;min-height:200px;display:flex;align-items:center;justify-content:center}.enemy .monster img{max-width:90%;height:190px;object-fit:contain}.worldmap{position:relative;aspect-ratio:1536/1024;overflow:hidden;border-radius:12px;background:#07111b url('mapa-eldoria.png') center/contain no-repeat!important}.mapSpot:nth-child(1){left:20.2%!important;top:27.2%!important}.mapSpot:nth-child(2){left:35.5%!important;top:25.2%!important}@media(max-width:900px){.layout{grid-template-columns:72px minmax(0,1fr)}.sideTitle,.sideBox{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:'◆';font-size:12px}.content{padding:16px}.row{grid-template-columns:1fr}}@media(max-width:640px){.banner{height:56vw;min-height:175px;max-height:300px}.topStats{left:8px;right:8px;top:8px}.layout{display:block}.side{position:sticky;top:0;z-index:20;padding:6px}.nav{display:flex;overflow:auto}.nav button,.nav button:first-child{font-size:11px;white-space:nowrap;width:auto;padding:8px 10px}.nav button:before{display:none}.content{padding:10px}.grid{grid-template-columns:1fr}.quest{align-items:flex-start;flex-wrap:wrap}.missionThumb{width:145px;height:92px}}</style></head><body><div class="site"><header class="banner"><div class="topStats" id="topStats"></div></header><div class="layout"><aside class="side"><div class="sideTitle">Navegação</div><div class="nav" id="nav"></div><div class="sideBox"><b style="color:#fff">Eldoria</b><br>Explore regiões, enfrente criaturas e evolua seu herói.</div><div class="sideTitle">Classes</div><div class="sideBox">⚔️ Cavaleiro<br>🔮 Mago<br>🏹 Arqueiro</div></aside><main class="content" id="main"><div class="panel"><div class="panelBody">Carregando Eldoria...</div></div></main></div></div><script src="app.js?v=20261023-10"></script><script src="game-expansion.js?v=20261023-1"></script><script src="battle-ui.js?v=20261024-5"></script><script src="ceo-panel.js?v=20261023-1"></script><script src="ceo-items-admin.js?v=20261023-1"></script><script src="characters.js?v=20261023-4"></script><script src="inventory-ui.js?v=20261023-1"></script><script src="attribute-training.js?v=20261023-1"></script><script>(()=>{const missionImage='Cavaleiro Herói Diante do Castelo Real.png';function decorate(){document.querySelectorAll('.quest').forEach(card=>{if(card.dataset.img||!(card.textContent||'').includes('Patrulha nos Arredores'))return;let img=document.createElement('img');img.src=missionImage;img.alt='Patrulha nos Arredores';img.className='missionThumb';card.prepend(img);card.classList.add('missionDecorated');card.dataset.img='1'})}new MutationObserver(decorate).observe(document.getElementById('main'),{childList:true,subtree:true});decorate()})();</script></body></html>
