<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090c"><title>Legends of Eldoria</title><style>
:root{--bg:#07090c;--panel:#0d1015;--panel2:#11151b;--line:#202631;--text:#f3f5f7;--muted:#89919d;--gold:#d79a2b;--red:#dc4053;--blue:#27a8d4}*{box-sizing:border-box}html,body{margin:0;background:#050608;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}button,input{font:inherit}.site{max-width:1500px;margin:auto;min-height:100vh;background:var(--bg)}.banner{height:clamp(220px,37.5vw,562px);position:relative;background:#090a0d url('banner.png') 50% 48%/cover no-repeat;border-bottom:1px solid #15191f}.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent 16%)}.topStats{position:absolute;right:18px;top:18px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}.stat{background:#080a0de8;border:1px solid #252b34;padding:7px 10px;border-radius:8px;font-size:12px}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:650px}.side{background:#090b0e;border-right:1px solid #171b21;padding:18px 12px}.sideTitle{padding:10px 11px 7px;color:#626b77;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.nav{display:grid;gap:3px}.nav button{width:100%;border:0;background:transparent;text-align:left;color:#a8afb9;padding:10px 11px;border-radius:8px;cursor:pointer;font-weight:600}.nav button:hover{background:#11151a;color:#fff}.nav button:first-child{background:#17130d;color:#f3b34b}.sideBox{margin:16px 6px;padding:12px;background:#0d1014;border-radius:10px;color:#7f8792;line-height:1.65}.content{min-width:0;padding:20px 24px 36px}.titlebar{display:flex;align-items:flex-end;justify-content:space-between;padding:1px 2px 14px;margin-bottom:14px}.titlebar h1{margin:0;font-size:22px}.muted{color:var(--muted)}.panel,.card,.hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:#e8ebef}.panel{margin-bottom:14px;overflow:hidden}.panelHead{font-weight:750;padding:13px 16px;background:#10141a;border-bottom:1px solid #1b2028}.panelBody,.card{padding:16px}.hero{padding:20px;margin-bottom:14px}.hero h1{margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.class{text-align:center;cursor:pointer}.class .icon{font-size:48px;margin:10px}.btn{border:1px solid #303742;border-radius:8px;background:#181d24;color:#edf0f4;padding:10px 14px;font-weight:700;cursor:pointer}.btn:hover{background:#222831}.btn.secondary{background:#102023;color:#bcebe5}.btn.red{background:#211115;color:#efb0b6;border-color:#4b222a}.btn.gold{background:#b77b1f;color:#100c06}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bar{height:7px;background:#181d23;border-radius:999px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--gold)}.bar.hp i{background:var(--red)}.battlelog{display:grid;gap:0;max-height:220px;overflow:auto}.battlelog div{padding:10px 0;border-bottom:1px solid #171c22;color:#aeb5bf}.battlelog div:first-child{color:#e8bd69;font-weight:700}.quest,.item{background:#0b0e12;border:1px solid #1b2027;border-radius:10px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:10px}.missionThumb{width:190px;height:112px;object-fit:cover;flex:0 0 auto;border:1px solid #282e36;border-radius:9px}.missionDecorated>div{flex:1;min-width:0}.tag{background:#171c22;color:#c8ced6;padding:5px 8px;border-radius:7px;font-size:11px}.form{display:grid;gap:9px;max-width:500px}.form input{padding:11px;background:#080a0c;border:1px solid #222831;color:#fff;border-radius:8px}.worldmap{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:12px}.mapSpot:nth-child(1){left:20.2%!important;top:27.2%!important}.mapSpot:nth-child(2){left:35.5%!important;top:25.2%!important}
/* HUD de batalha */.battleHud{display:grid;grid-template-columns:minmax(0,1fr) 260px;grid-template-areas:"boss side" "stage side" "bottom bottom";gap:12px}.hudBoss{grid-area:boss;background:#0b0e12;border:1px solid #202631;border-radius:11px;padding:14px 16px}.hudBossTop{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:9px}.hudBossName{font-size:17px;font-weight:800}.hudLevel{color:#9ba3ae;font-size:12px}.hudHpRow{display:flex;align-items:center;gap:12px}.hudHp{height:10px;flex:1;background:#1b2027;border-radius:999px;overflow:hidden}.hudHp i{display:block;height:100%;background:#d94355;border-radius:999px;transition:.2s}.hudHpText{min-width:74px;text-align:right;font-size:12px;font-weight:700;color:#cfd4da}.hudSide{grid-area:side;background:#0b0e12;border:1px solid #202631;border-radius:11px;padding:15px}.hudSideTitle{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#737d89;margin-bottom:12px}.hudPlayer{font-size:15px;font-weight:800;margin-bottom:13px}.hudStat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #171c22;color:#aeb5bf}.hudStat b{color:#f0f2f4}.hudStage{grid-area:stage;min-height:430px;position:relative;display:flex;align-items:center;justify-content:center;background:#090b0e;border:1px solid #1c2128;border-radius:11px;overflow:hidden}.hudStage:after{content:"";position:absolute;left:15%;right:15%;bottom:35px;height:1px;background:#20252c}.hudMonster{width:min(520px,80%);height:330px;object-fit:contain;position:relative;z-index:1}.hudMonsterFallback{font-size:110px}.hudInfo{position:absolute;left:18px;bottom:16px;z-index:2;background:#090b0ee8;border:1px solid #222831;border-radius:8px;padding:9px 12px;font-size:12px;color:#aeb5bf}.hudInfo b{color:#fff}.hudBottom{grid-area:bottom;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:12px}.hudActions,.hudLog{background:#0b0e12;border:1px solid #202631;border-radius:11px;padding:14px}.hudSectionTitle{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#737d89;margin-bottom:10px}.hudActionGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.hudAction{min-height:48px;border:1px solid #2b323c;border-radius:8px;background:#14191f;color:#e9edf2;font-weight:700;cursor:pointer}.hudAction:hover{background:#1c222a;border-color:#414a56}.hudAction.primary{border-color:#6e5222;background:#20190e;color:#f0c978}.hudAction.item{color:#9de2da}.hudAction.danger{color:#e7a0a9;background:#1d1013;border-color:#432128}.hudLog .battlelog{margin:0}.enemy{display:none!important}.battleHudSource{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:72px minmax(0,1fr)}.sideTitle,.sideBox{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:"◆";font-size:12px}.content{padding:16px}.battleHud{grid-template-columns:1fr;grid-template-areas:"boss" "stage" "side" "bottom"}.hudBottom{grid-template-columns:1fr}.hudActionGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.banner{height:56vw;min-height:175px;max-height:300px}.topStats{left:8px;right:8px;top:8px}.layout{display:block}.side{position:sticky;top:0;z-index:20;padding:6px}.nav{display:flex;overflow:auto}.nav button,.nav button:first-child{font-size:11px;white-space:nowrap;width:auto;padding:8px 10px}.nav button:before{display:none}.content{padding:10px}.grid,.row{grid-template-columns:1fr}.quest{align-items:flex-start;flex-wrap:wrap}.missionThumb{width:145px;height:92px}.hudStage{min-height:300px}.hudMonster{height:230px;width:90%}.hudActionGrid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="site"><header class="banner"><div class="topStats" id="topStats"></div></header><div class="layout"><aside class="side"><div class="sideTitle">Navegação</div><div class="nav" id="nav"></div><div class="sideBox"><b style="color:#fff">Eldoria</b><br>Explore regiões, enfrente criaturas e evolua seu herói.</div><div class="sideTitle">Classes</div><div class="sideBox">⚔️ Cavaleiro<br>🔮 Mago<br>🏹 Arqueiro</div></aside><main class="content" id="main"><div class="panel"><div class="panelBody">Carregando Eldoria...</div></div></main></div></div><script src="app.js?v=20261023-9"></script><script>
(()=>{const missionImage='Cavaleiro Herói Diante do Castelo Real.png';function decorateMissions(){document.querySelectorAll('.quest').forEach(card=>{if(card.dataset.missionImage)return;if(!(card.textContent||'').includes('Patrulha nos Arredores'))return;const img=document.createElement('img');img.src=missionImage;img.alt='Patrulha nos Arredores';img.className='missionThumb';card.prepend(img);card.classList.add('missionDecorated');card.dataset.missionImage='1'})}function buildHud(){const enemyCard=document.querySelector('.enemy');if(!enemyCard||document.querySelector('.battleHud'))return;const row=enemyCard.closest('.row'),player=enemyCard.nextElementSibling;if(!row||!player)return;const name=enemyCard.querySelector('h2')?.textContent||'Inimigo',level=enemyCard.querySelector('h2+div')?.textContent||'',hpText=enemyCard.querySelector('p')?.textContent?.replace('❤️','').trim()||'',hpWidth=enemyCard.querySelector('.bar.hp i')?.style.width||'100%',img=name==='Slime Sombrio'?'<img class="hudMonster" src="slime-sombrio.png" alt="Slime Sombrio">':`<div class="hudMonsterFallback">${enemyCard.querySelector('.monster')?.textContent||'👹'}</div>`,pname=player.querySelector('.panelHead')?.textContent||'Aventureiro',stats=player.querySelector('.panelBody>p')?.textContent||'',logs=[...player.querySelectorAll('.battlelog div')].map(x=>`<div>${x.textContent}</div>`).join('');row.classList.add('battleHudSource');const hud=document.createElement('div');hud.className='battleHud';hud.innerHTML=`<section class="hudBoss"><div class="hudBossTop"><div><div class="hudBossName">${name}</div><div class="hudLevel">${level}</div></div><div class="hudHpText">HP ${hpText}</div></div><div class="hudHpRow"><div class="hudHp"><i style="width:${hpWidth}"></i></div></div></section><aside class="hudSide"><div class="hudSideTitle">Personagem</div><div class="hudPlayer">${pname}</div><div class="hudStat"><span>Vida / Mana</span><b>${stats}</b></div><div class="hudStat"><span>Região</span><b>${document.querySelector('.titlebar .muted')?.textContent||'Eldoria'}</b></div><div class="hudStat"><span>Estado</span><b>Em combate</b></div></aside><section class="hudStage">${img}<div class="hudInfo"><b>${name}</b><br>${level}</div></section><section class="hudBottom"><div class="hudActions"><div class="hudSectionTitle">Ações</div><div class="hudActionGrid"><button class="hudAction primary" onclick="attack(false)">⚔️ Ataque</button><button class="hudAction primary" onclick="attack(true)">✨ Habilidade</button><button class="hudAction" onclick="attack(false)">🛡️ Defender</button><button class="hudAction item" onclick="potion()">🧪 Usar item</button><button class="hudAction danger" onclick="home()">Fugir</button></div></div><div class="hudLog"><div class="hudSectionTitle">Log de batalha</div><div class="battlelog">${logs}</div></div></section>`;row.after(hud)}function decorate(){decorateMissions();buildHud()}new MutationObserver(decorate).observe(document.getElementById('main'),{childList:true,subtree:true});decorate()})();
</script></body></html>
