<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090714"><title>Legends of Eldoria</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 50% 0,#20163a,#080711 55%);color:#f5f0ff;min-height:100vh}button,input{font:inherit}.top{height:68px;border-bottom:1px solid #31264b;background:#0b0914dd;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.logo{font-weight:950;letter-spacing:1px}.logo b{color:#c694ff}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#171225;border:1px solid #35294e;padding:8px 12px;border-radius:10px;font-size:13px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 68px)}aside{padding:18px;background:#0d0a17;border-right:1px solid #2a213d}.nav button{width:100%;display:block;border:0;background:transparent;color:#a99bbb;text-align:left;padding:12px;border-radius:9px;margin:3px 0;cursor:pointer;font-weight:750}.nav button:hover{background:#211833;color:white}main{padding:26px}.card{background:#12101d;border:1px solid #332847;border-radius:16px;padding:20px;box-shadow:0 15px 50px #0003}.hero{padding:34px;background:linear-gradient(135deg,#211536,#10111e);margin-bottom:16px}.hero h1{font-size:36px;margin:0 0 8px}.muted{color:#a89bb9}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.class{cursor:pointer;text-align:center;transition:.2s;min-height:230px}.class:hover{transform:translateY(-3px);border-color:#8f5bd3}.class .icon{font-size:56px;margin:14px}.btn{border:0;border-radius:10px;background:#8d5bd0;color:white;padding:12px 16px;font-weight:900;cursor:pointer}.btn.gold{background:#d8a84e;color:#211500}.btn.red{background:#a83e55}.btn.secondary{background:#292039}.bar{height:10px;background:#211a30;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#6bdc8c}.bar.hp i{background:#d75567}.row{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.enemy{text-align:center}.enemy .monster{font-size:82px}.battlelog{max-height:250px;overflow:auto;display:grid;gap:7px}.battlelog div{background:#0c0a13;padding:9px;border-radius:8px}.quest{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:10px 0;padding:14px;background:#0d0b16;border-radius:11px}.item{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #2a213d}.tag{background:#2a2040;padding:4px 8px;border-radius:7px;font-size:12px}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.zone{min-height:140px;cursor:pointer}.zone:hover{border-color:#8f5bd3}.zone h3{margin-top:0}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.form{display:grid;gap:12px;max-width:520px}.form input{padding:13px;border:1px solid #43345e;background:#0c0a13;color:white;border-radius:9px}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:none}.grid,.map,.row{grid-template-columns:1fr}.stats{gap:5px}.stat{padding:6px}.top{height:auto;min-height:68px;gap:8px}.hero h1{font-size:28px}}</style></head><body><header class="top"><div class="logo">LEGENDS OF <b>ELDORIA</b></div><div class="stats" id="topStats"></div></header><div class="layout"><aside><div class="nav" id="nav"></div></aside><main id="main"><div class="card">Carregando mundo...</div></main></div><script src="app.js?v=10"></script></body></html>
