<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Legends of Eldoria</title><style>:root{--bg:#050505;--side:#08090b;--card:#0c0e11;--line:#20242b;--text:#f5f5f5;--muted:#8b929d;--accent:#f0a52b;--red:#d94855}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}button,input{font:inherit}.site{max-width:1500px;margin:auto;min-height:100vh;background:#070809}.banner{height:clamp(220px,37.5vw,562px);position:relative;background-color:#090a0d;background-image:url('banner.png');background-repeat:no-repeat;background-size:cover;background-position:50% 48%;border-bottom:1px solid #15181d}.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#070809,transparent 16%);pointer-events:none}.topStats{position:absolute;right:18px;top:18px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}.stat{background:#070809df;border:1px solid #292e36;padding:7px 10px;border-radius:9px;backdrop-filter:blur(12px);font-size:12px}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:650px}.side{background:var(--side);border-right:1px solid #15181d;padding:18px 12px}.sideTitle{padding:10px 11px 7px;color:#656d79;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.nav{display:grid;gap:3px}.nav button{width:100%;border:0;background:transparent;text-align:left;color:#a8afb9;padding:10px 11px;border-radius:9px;cursor:pointer;font-weight:600}.nav button:hover{background:#101318;color:#fff}.nav button:first-child{background:#17130d;color:#f3b34b}.sideBox{margin:16px 6px;padding:12px;background:#0b0d10;border:0;border-radius:12px;color:#7f8792;line-height:1.65}.content{min-width:0;padding:20px 24px 36px}.titlebar{display:flex;align-items:flex-end;justify-content:space-between;padding:1px 2px 14px;margin-bottom:16px}.titlebar h1{margin:0;font-size:23px}.panel,.card{background:linear-gradient(145deg,#0f1216,#090b0e);border:0;border-radius:16px;color:#e8ebef;box-shadow:0 12px 32px #0005}.panel{margin-bottom:16px;overflow:hidden}.panelHead{font-size:14px;font-weight:800;padding:14px 18px;background:linear-gradient(90deg,#12161b,#0c0f13);border:0}.panelBody,.card{padding:18px}.hero{background:linear-gradient(145deg,#11151a,#090b0e);border:0;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 12px 32px #0004}.hero h1{margin:0 0 5px;font-size:25px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.class{text-align:center;cursor:pointer;min-height:205px}.class .icon{font-size:48px;margin:10px}.btn{border:0;border-radius:10px;background:#e89c26;color:#160f06;padding:10px 15px;font-weight:800;cursor:pointer;box-shadow:0 5px 14px #0004}.btn:hover{background:#ffb83f;transform:translateY(-1px)}.btn.secondary{background:#171b21;color:#d7dce3}.btn.red{background:#321318;color:#f4aeb4}.btn.gold{background:#d99427}.row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:16px}.bar{height:7px;background:#050607;border-radius:999px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}.bar.hp i{background:var(--red)}.enemy{text-align:center}.enemy .monster{font-size:74px;min-height:190px;display:flex;align-items:center;justify-content:center}.enemy .monster img{width:min(250px,75%);height:190px;object-fit:contain;filter:drop-shadow(0 14px 22px #000b)}.battlelog{display:grid;gap:7px;max-height:230px;overflow:auto}.battlelog div{background:#0b0e12;border:0;border-radius:10px;padding:10px}.quest,.item{background:linear-gradient(120deg,#0d1115,#080a0d);border:0;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:10px;box-shadow:inset 0 1px 0 #ffffff0b,0 7px 18px #0003}.quest:hover{background:linear-gradient(120deg,#11161c,#0a0d11)}.missionThumb{width:190px;height:112px;object-fit:cover;flex:0 0 auto;border:2px solid #ffffff1c;border-radius:12px;background:#111;box-shadow:0 8px 22px #000a}.missionDecorated>div{flex:1;min-width:0}.tag{background:#191e25;color:#c8ced6;padding:5px 8px;border-radius:8px;font-size:11px}.form{display:grid;gap:9px;max-width:500px}.form input{padding:11px;background:#080a0c;border:0;color:#fff;border-radius:9px}.worldmap{position:relative;aspect-ratio:16/9;overflow:hidden;border:0;border-radius:16px;box-shadow:0 14px 36px #0008}.mapSpot:nth-child(1){left:20.2%!important;top:27.2%!important}.mapSpot:nth-child(2){left:35.5%!important;top:25.2%!important}@media(max-width:900px){.layout{grid-template-columns:72px minmax(0,1fr)}.sideTitle,.sideBox{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:"◆";font-size:12px}.row{grid-template-columns:1fr}.content{padding:16px}}@media(max-width:640px){.banner{height:56vw;min-height:175px;max-height:300px;background-position:50% 50%}.topStats{left:8px;right:8px;top:8px}.stat{font-size:10px;padding:6px 7px}.layout{display:block}.side{position:sticky;top:0;z-index:20;border:0;padding:6px;background:#08090bf2}.nav{display:flex;overflow:auto}.nav button,.nav button:first-child{font-size:11px;white-space:nowrap;width:auto;padding:8px 10px}.nav button:before{display:none}.content{padding:11px}.grid{grid-template-columns:1fr}.quest{align-items:flex-start;flex-wrap:wrap}.missionThumb{width:145px;height:92px}.enemy .monster img{height:150px}}</style></head><body><div class="site"><header class="banner"><div class="topStats" id="topStats"></div></header><div class="layout"><aside class="side"><div class="sideTitle">Navegação</div><div class="nav" id="nav"></div><div class="sideBox"><b style="color:#fff">Eldoria</b><br>Explore regiões, enfrente criaturas e evolua seu herói.</div><div class="sideTitle">Classes</div><div class="sideBox">⚔️ Cavaleiro<br>🔮 Mago<br>🏹 Arqueiro</div></aside><main class="content" id="main"><div class="panel"><div class="panelBody">Carregando Eldoria...</div></div></main></div></div><script src="app.js?v=20261023-4"></script><script>(()=>{const missionImage='Cavaleiro Herói Diante do Castelo Real.png';function decorateMissions(){document.querySelectorAll('.quest').forEach(card=>{if(card.dataset.missionImage)return;const text=card.textContent||'';if(!text.includes('Patrulha nos Arredores'))return;const img=document.createElement('img');img.src=missionImage;img.alt='Cavaleiro herói diante do Castelo Real';img.className='missionThumb';card.prepend(img);card.classList.add('missionDecorated');card.dataset.missionImage='1'})}function decorateSlime(){document.querySelectorAll('.enemy').forEach(card=>{if(!(card.textContent||'').includes('Slime Sombrio'))return;const monster=card.querySelector('.monster');if(!monster||monster.querySelector('img'))return;monster.innerHTML='<img src="slime-sombrio.png" alt="Slime Sombrio">'})}function decorate(){decorateMissions();decorateSlime()}const observer=new MutationObserver(decorate);observer.observe(document.getElementById('main'),{childList:true,subtree:true});decorate()})();</script></body></html>
