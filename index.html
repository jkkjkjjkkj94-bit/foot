<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Legends of Eldoria</title><style>:root{--bg:#050505;--side:#08090b;--card:#0c0e11;--line:#20242b;--text:#f5f5f5;--muted:#8b929d;--accent:#d99a2b;--red:#d94855}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}button,input{font:inherit}.site{max-width:1500px;margin:auto;min-height:100vh;background:#070809}.banner{height:clamp(220px,37.5vw,562px);position:relative;background:#090a0d url('banner.png') 50% 48%/cover no-repeat;border-bottom:1px solid #15181d}.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#070809,transparent 16%);pointer-events:none}.topStats{position:absolute;right:18px;top:18px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}.stat{background:#070809df;border:1px solid #292e36;padding:7px 10px;border-radius:9px;backdrop-filter:blur(12px);font-size:12px}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:650px}.side{background:var(--side);border-right:1px solid #15181d;padding:18px 12px}.sideTitle{padding:10px 11px 7px;color:#656d79;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.nav{display:grid;gap:3px}.nav button{width:100%;border:0;background:transparent;text-align:left;color:#a8afb9;padding:10px 11px;border-radius:9px;cursor:pointer;font-weight:600}.nav button:hover{background:#101318;color:#fff}.nav button:first-child{background:#17130d;color:#f3b34b}.sideBox{margin:16px 6px;padding:12px;background:#0b0d10;border-radius:12px;color:#7f8792;line-height:1.65}.content{min-width:0;padding:20px 24px 36px}.titlebar{display:flex;align-items:flex-end;justify-content:space-between;padding:1px 2px 14px;margin-bottom:16px}.titlebar h1{margin:0;font-size:23px}.panel,.card{background:#0b0e12;border:1px solid #1b2027;border-radius:14px;color:#e8ebef}.panel{margin-bottom:16px;overflow:hidden}.panelHead{font-size:14px;font-weight:750;padding:14px 18px;background:#0e1116;border-bottom:1px solid #181d24}.panelBody,.card{padding:18px}.hero{background:#0c0f13;border:1px solid #1b2027;border-radius:14px;padding:20px;margin-bottom:16px}.hero h1{margin:0 0 5px;font-size:25px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.class{text-align:center;cursor:pointer;min-height:205px}.class .icon{font-size:48px;margin:10px}.btn{border:1px solid #2a3038;border-radius:9px;background:#171b21;color:#e8edf3;padding:10px 15px;font-weight:700;cursor:pointer;transition:.15s}.btn:hover{background:#20262e;border-color:#3a424d}.btn.secondary{background:#10151a;color:#bcebe5}.btn.red{background:#1b1013;color:#efb0b6;border-color:#422027}.btn.gold{background:#b77b1f;color:#100c06;border-color:#d59631}.row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:16px}.bar{height:7px;background:#15191f;border-radius:999px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}.bar.hp i{background:var(--red)}.enemy{text-align:center;background:#0a0c0f;border:1px solid #1d2229;border-radius:14px;overflow:hidden}.enemy:before,.enemy .panelHead:before,.enemy .panelHead:after,.enemy .bar.hp:before,.enemy .bar.hp:after{display:none!important}.enemy .panelHead{margin:0;padding:14px 18px;width:auto;color:#d8dde4;font-family:inherit;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;background:#0e1115;border:0;border-bottom:1px solid #1b2026;border-radius:0;box-shadow:none}.enemy .panelBody{padding:24px}.enemy .monster{min-height:250px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}.enemy .monster img{width:min(390px,90%);height:250px;object-fit:cover;border-radius:10px;filter:none}.enemy h2{font-family:inherit;font-size:26px;margin:10px auto 5px;color:#f3f5f7;text-shadow:none}.enemy h2+div{display:inline-block;padding:4px 10px;margin:2px 0 8px;border:1px solid #282e36;border-radius:7px;background:#11151a;color:#aeb6c1;font-size:12px;font-weight:700}.enemy p{font-size:15px;font-weight:700;margin:10px 0 8px}.enemy .bar.hp{height:10px;padding:0;margin:10px 0 0;background:#191d23;border:0;border-radius:999px;overflow:hidden;box-shadow:none}.enemy .bar.hp i{border-radius:999px;background:#d84659;box-shadow:none;transition:width .25s ease}.row>.panel:not(.enemy){background:#0a0d11;border:1px solid #1d2229;border-radius:14px;box-shadow:none}.row>.panel:not(.enemy)>.panelHead{margin:0;padding:15px 18px;background:#0e1115;border:0;border-bottom:1px solid #1b2026;border-radius:0;color:#f0f2f5;font-family:inherit;font-size:16px;box-shadow:none}.row>.panel:not(.enemy)>.panelBody{padding:18px}.row>.panel:not(.enemy)>.panelBody>p:first-child{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0;margin:0 0 12px;background:transparent;border-radius:0;font-size:15px;font-weight:700}.row>.panel:not(.enemy)>.panelBody>.bar.hp{height:9px;padding:0;background:#191d23;border:0;border-radius:999px;box-shadow:none}.row>.panel:not(.enemy)>.panelBody>.bar.hp i{border-radius:999px;background:#d84659;box-shadow:none}.row>.panel:not(.enemy) .btn{position:static;min-height:42px;margin:12px 5px 0 0;padding:10px 14px;border:1px solid #303741;border-radius:9px;background:#171c22;color:#e7ebf0;font-family:inherit;font-size:13px;letter-spacing:0;text-shadow:none;box-shadow:none;overflow:visible}.row>.panel:not(.enemy) .btn:before{display:none!important}.row>.panel:not(.enemy) .btn:hover{background:#222831;border-color:#48515d;color:#fff;filter:none;transform:none;box-shadow:none}.row>.panel:not(.enemy) .btn:first-of-type{background:#b67a20;border-color:#c88c31;color:#100c06}.row>.panel:not(.enemy) .btn.secondary{background:#102022;border-color:#1f4b4d;color:#aee8e2;box-shadow:none}.row>.panel:not(.enemy) .btn.red{background:#211115;border-color:#4b222a;color:#efb0b7;box-shadow:none}.battlelog{display:grid;gap:1px;max-height:280px;overflow:auto;margin-top:18px;padding:0;border-top:1px solid #1a1f25}.battlelog div{background:transparent;border:0;border-bottom:1px solid #151a20;border-left:0;border-radius:0;padding:12px 2px;color:#aeb5bf;line-height:1.35;box-shadow:none}.battlelog div:first-child{border-left:0;background:transparent;color:#e7b85f;font-weight:700}.quest,.item{background:#0b0e12;border:1px solid #1b2027;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:10px}.missionThumb{width:190px;height:112px;object-fit:cover;flex:0 0 auto;border:1px solid #282e36;border-radius:10px;background:#111}.missionDecorated>div{flex:1;min-width:0}.tag{background:#171c22;color:#c8ced6;padding:5px 8px;border-radius:7px;font-size:11px}.form{display:grid;gap:9px;max-width:500px}.form input{padding:11px;background:#080a0c;border:1px solid #222831;color:#fff;border-radius:9px}.worldmap{position:relative;aspect-ratio:16/9;overflow:hidden;border:0;border-radius:14px}.mapSpot:nth-child(1){left:20.2%!important;top:27.2%!important}.mapSpot:nth-child(2){left:35.5%!important;top:25.2%!important}@media(max-width:900px){.layout{grid-template-columns:72px minmax(0,1fr)}.sideTitle,.sideBox{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:"◆";font-size:12px}.row{grid-template-columns:1fr}.content{padding:16px}}@media(max-width:640px){.banner{height:56vw;min-height:175px;max-height:300px;background-position:50% 50%}.topStats{left:8px;right:8px;top:8px}.stat{font-size:10px;padding:6px 7px}.layout{display:block}.side{position:sticky;top:0;z-index:20;border:0;padding:6px;background:#08090bf2}.nav{display:flex;overflow:auto}.nav button,.nav button:first-child{font-size:11px;white-space:nowrap;width:auto;padding:8px 10px}.nav button:before{display:none}.content{padding:11px}.grid{grid-template-columns:1fr}.quest{align-items:flex-start;flex-wrap:wrap}.missionThumb{width:145px;height:92px}.enemy .monster{min-height:190px}.enemy .monster img{height:190px}.enemy h2{font-size:22px}.row>.panel:not(.enemy) .btn{min-height:40px;padding:9px 11px}.row>.panel:not(.enemy)>.panelBody{padding:14px}}</style></head><body><div class="site"><header class="banner"><div class="topStats" id="topStats"></div></header><div class="layout"><aside class="side"><div class="sideTitle">Navegação</div><div class="nav" id="nav"></div><div class="sideBox"><b style="color:#fff">Eldoria</b><br>Explore regiões, enfrente criaturas e evolua seu herói.</div><div class="sideTitle">Classes</div><div class="sideBox">⚔️ Cavaleiro<br>🔮 Mago<br>🏹 Arqueiro</div></aside><main class="content" id="main"><div class="panel"><div class="panelBody">Carregando Eldoria...</div></div></main></div></div><script src="app.js?v=20261023-8"></script><script>(()=>{const missionImage='Cavaleiro Herói Diante do Castelo Real.png';function decorateMissions(){document.querySelectorAll('.quest').forEach(card=>{if(card.dataset.missionImage)return;const text=card.textContent||'';if(!text.includes('Patrulha nos Arredores'))return;const img=document.createElement('img');img.src=missionImage;img.alt='Cavaleiro herói diante do Castelo Real';img.className='missionThumb';card.prepend(img);card.classList.add('missionDecorated');card.dataset.missionImage='1'})}function decorateSlime(){document.querySelectorAll('.enemy').forEach(card=>{if(!(card.textContent||'').includes('Slime Sombrio'))return;const monster=card.querySelector('.monster');if(!monster||monster.querySelector('img'))return;monster.innerHTML='<img src="slime-sombrio.png" alt="Slime Sombrio">'})}function decorate(){decorateMissions();decorateSlime()}const observer=new MutationObserver(decorate);observer.observe(document.getElementById('main'),{childList:true,subtree:true});decorate()})();</script></body></html>
