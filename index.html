<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foot Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#07111f;color:#eef5ff}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#0b1728;padding:28px;border-right:1px solid #1d3048}.brand{font-size:25px;font-weight:900;line-height:1.35;margin-bottom:28px}.brand span{display:block;color:#39d879}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#9fb1c8;padding:12px;border-radius:9px;text-align:left;font-weight:700;cursor:pointer}.nav button:hover{background:#172940;color:#fff}main{padding:30px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.head h1{margin:0}.muted{color:#91a5bd}.card{background:#0e1d30;border:1px solid #203650;border-radius:14px;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.big{font-size:27px;font-weight:900;margin-top:7px}.row{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}.btn{border:0;border-radius:9px;padding:12px 16px;background:#39d879;color:#052013;font-weight:900;cursor:pointer}.btn.secondary{background:#203650;color:#fff}.form{display:grid;gap:12px;max-width:560px}.form input,.form select{padding:13px;border:1px solid #29415e;border-radius:9px;background:#091727;color:white}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #203650;text-align:left}.table th{font-size:12px;color:#8fa3bd}.pill{padding:4px 8px;border-radius:7px;background:#1c334d}.news{display:grid;gap:8px}.news div{background:#091727;padding:11px;border-radius:9px}.match{text-align:center}.match h2{margin:25px 0}.error{padding:20px;background:#3b1620;border:1px solid #7d293b;border-radius:12px}@media(max-width:850px){.app{grid-template-columns:1fr}aside{padding:18px}.nav{display:flex;overflow:auto}.nav button{min-width:120px}.cards{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}@media(max-width:520px){main{padding:16px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside><div class="brand">FOOT<span>MANAGER</span></div><div class="nav" id="nav"></div></aside><main id="main"><div class="card">Carregando jogo...</div></main></div>
<script src="app.js?v=3"></script>
</body></html>
