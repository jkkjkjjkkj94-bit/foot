<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Legends of Eldoria</title><style>:root{--bg:#050505;--side:#08090b;--card:#0c0e11;--line:#20242b;--text:#f5f5f5;--muted:#8b929d;--accent:#f0a52b;--red:#d94855}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}button,input{font:inherit}.site{max-width:1500px;margin:auto;min-height:100vh;background:#070809}.banner{height:clamp(220px,37.5vw,562px);position:relative;background-color:#090a0d;background-image:url('banner.png');background-repeat:no-repeat;background-size:cover;background-position:50% 48%;border-bottom:1px solid var(--line)}.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#070809,transparent 16%);pointer-events:none}.topStats{position:absolute;right:18px;top:18px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}.stat{background:#070809df;border:1px solid #292e36;padding:7px 10px;border-radius:7px;backdrop-filter:blur(12px);font-size:12px}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:650px}.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px}.sideTitle{padding:10px 11px 7px;color:#656d79;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.nav{display:grid;gap:3px}.nav button{width:100%;border:1px solid transparent;background:transparent;text-align:left;color:#a8afb9;padding:10px 11px;border-radius:7px;cursor:pointer;font-weight:600}.nav button:hover{background:#101318;border-color:#1d2229;color:#fff}.nav button:first-child{background:#17130d;border-color:#392816;color:#f3b34b}.sideBox{margin:16px 6px;padding:12px;background:#0b0d10;border:1px solid #1c2026;border-radius:9px;color:#7f8792;line-height:1.65}.content{min-width:0;padding:20px 24px 36px}.titlebar{display:flex;align-items:flex-end;justify-content:space-between;padding:1px 2px 14px;border-bottom:1px solid var(--line);margin-bottom:16px}.titlebar h1{margin:0;font-size:23px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;color:#e8ebef}.panel{margin-bottom:12px;overflow:hidden}.panelHead{font-size:14px;font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);background:#0e1115}.panelBody,.card{padding:14px}.hero{background:#0e1115;border:1px solid var(--line);border-radius:11px;padding:18px;margin-bottom:12px}.hero h1{margin:0 0 5px;font-size:25px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.class{text-align:center;cursor:pointer;min-height:205px}.class .icon{font-size:48px;margin:10px}.btn{border:1px solid #5b3d17;border-radius:7px;background:#e89c26;color:#160f06;padding:9px 13px;font-weight:750;cursor:pointer}.btn:hover{background:#ffb83f}.btn.secondary{background:#12161b;color:#d7dce3;border-color:#2a3038}.btn.red{background:#241013;color:#f4aeb4;border-color:#562329}.btn.gold{background:#d99427}.row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:12px}.bar{height:6px;background:#050607;border-radius:999px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--accent)}.bar.hp i{background:var(--red)}.enemy{text-align:center}.enemy .monster{font-size:74px}.battlelog{display:grid;gap:6px;max-height:230px;overflow:auto}.battlelog div,.quest,.item{background:#080a0c;border:1px solid #1b2026;border-radius:7px;padding:9px}.quest,.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.missionThumb{width:112px;height:72px;object-fit:cover;flex:0 0 auto;border:1px solid #343b45;border-radius:8px;background:#111;box-shadow:0 4px 14px #0008}.missionDecorated>div{flex:1;min-width:0}.tag{background:#171b20;color:#c8ced6;padding:4px 7px;border-radius:6px;font-size:11px}.form{display:grid;gap:9px;max-width:500px}.form input{padding:11px;background:#080a0c;border:1px solid #292f37;color:#fff;border-radius:7px}.worldmap{position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid #30363e;border-radius:14px}.mapSpot:nth-child(1){left:20.2%!important;top:27.2%!important}.mapSpot:nth-child(2){left:35.5%!important;top:25.2%!important}@media(max-width:900px){.layout{grid-template-columns:72px minmax(0,1fr)}.sideTitle,.sideBox{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:"◆";font-size:12px}.row{grid-template-columns:1fr}.content{padding:16px}}@media(max-width:640px){.banner{height:56vw;min-height:175px;max-height:300px;background-position:50% 50%}.topStats{left:8px;right:8px;top:8px}.stat{font-size:10px;padding:6px 7px}.layout{display:block}.side{position:sticky;top:0;z-index:20;border:0;border-bottom:1px solid var(--line);padding:6px;background:#08090bf2}.nav{display:flex;overflow:auto}.nav button,.nav button:first-child{font-size:11px;white-space:nowrap;width:auto;padding:8px 10px}.nav button:before{display:none}.content{padding:11px}.grid{grid-template-columns:1fr}.missionThumb{width:82px;height:58px}}</style></head><body><div class="site"><header class="banner"><div class="topStats" id="topStats"></div></header><div class="layout"><aside class="side"><div class="sideTitle">Navegação</div><div class="nav" id="nav"></div><div class="sideBox"><b style="color:#fff">Eldoria</b><br>Explore regiões, enfrente criaturas e evolua seu herói.</div><div class="sideTitle">Classes</div><div class="sideBox">⚔️ Cavaleiro<br>🔮 Mago<br>🏹 Arqueiro</div></aside><main class="content" id="main"><div class="panel"><div class="panelBody">Carregando Eldoria...</div></div></main></div></div><script src="app.js?v=20261023-2"></script><script>(()=>{const missionImage='Cavaleiro Herói Diante do Castelo Real.png';function decorate(){document.querySelectorAll('.quest').forEach(card=>{if(card.dataset.missionImage)return;const text=card.textContent||'';if(!text.includes('Patrulha nos Arredores'))return;const img=document.createElement('img');img.src=missionImage;img.alt='Cavaleiro herói diante do Castelo Real';img.className='missionThumb';card.prepend(img);card.classList.add('missionDecorated');card.dataset.missionImage='1'})}const original=window.quests;if(typeof original==='function')window.quests=function(){original();requestAnimationFrame(decorate)};const observer=new MutationObserver(decorate);observer.observe(document.getElementById('main'),{childList:true,subtree:true});decorate()})();</script></body></html>
