<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foot Manager</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#07111f;color:#eef5ff}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#0b1728;padding:22px;border-right:1px solid #1d3048;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:900;margin-bottom:24px}.brand b{color:#39d879}.nav button{display:block;width:100%;padding:11px 12px;margin:5px 0;border:0;border-radius:9px;background:transparent;color:#9db0c8;text-align:left;font-weight:700;cursor:pointer}.nav button:hover,.nav button.active{background:#16263b;color:white}main{padding:28px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0}.muted{color:#8fa3bd}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0e1d30;border:1px solid #20354f;border-radius:14px;padding:18px}.big{font-size:26px;font-weight:900;margin-top:7px}.btn{border:0;border-radius:9px;padding:11px 16px;background:#35d27c;color:#042013;font-weight:900;cursor:pointer}.btn2{background:#203650;color:#fff}.row{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px}.match{text-align:center;padding:25px}.score{font-size:27px;font-weight:900;margin:22px}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{padding:10px;border-bottom:1px solid #1d3048;text-align:left}.table th{color:#8fa3bd;font-size:12px}.pos{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;background:#1c334d;border-radius:8px}.good{color:#45dd89}.bad{color:#ff6b6b}.tabs{display:flex;gap:8px;margin-bottom:18px}.form{display:grid;gap:10px;max-width:550px}.form input,.form select{padding:12px;background:#0b192a;color:#fff;border:1px solid #29415e;border-radius:9px}.player{display:flex;justify-content:space-between;align-items:center}.pill{background:#1b314a;padding:5px 8px;border-radius:7px;font-size:12px}.news{display:grid;gap:8px}.news div{background:#0a1727;padding:11px;border-radius:9px}.hide{display:none}@media(max-width:850px){.app{grid-template-columns:1fr}aside{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{min-width:120px}.cards{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}@media(max-width:500px){.cards{grid-template-columns:1fr}main{padding:16px}}</style></head><body><div class="app"><aside><div class="brand">FOOT <b>MANAGER</b></div><div class="nav" id="nav"></div></aside><main id="main"></main></div><script>
const TEAMS=['Aurora FC','Real Paulista','Atlético Vale','União Azul','Nacional City','Ferroviário SC','Estrela FC','Porto Real','Metropolitano','Independente','Esportivo Sul','Juventude Central'];
const first=['Lucas','Gabriel','Rafael','Matheus','Pedro','João','Bruno','Felipe','Diego','Gustavo','Caio','Vinícius','André','Thiago','Murilo'];const last=['Silva','Santos','Oliveira','Costa','Souza','Pereira','Almeida','Rocha','Lima','Martins','Ferreira','Gomes'];const pos=['GOL','ZAG','ZAG','LD','LE','VOL','MC','MC','MEI','PD','PE','ATA','ATA','ZAG','MC','ATA'];
let S=JSON.parse(localStorage.getItem('footSave')||'null');
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function name(){return first[rnd(0,first.length-1)]+' '+last[rnd(0,last.length-1)]}function players(team){return Array.from({length:22},(_,i)=>({id:team+'-'+i,n:name(),p:pos[i%pos.length],age:rnd(17,34),ov:rnd(58,82),pot:rnd(70,92),value:rnd(1,28),goals:0,apps:0,morale:75,fit:100}))}
function fresh(){let clubs=TEAMS.map((n,i)=>({id:i,n,pts:0,w:0,d:0,l:0,gf:0,ga:0,budget:rnd(15,60),strength:rnd(62,80),players:players(i)}));return{manager:'Treinador',club:0,season:2026,round:0,clubs,news:['Bem-vindo ao Foot Manager. Escolha seu clube e comece sua carreira.'],history:[],formation:'4-3-3',mentality:'Equilibrada',started:false}}
if(!S)S=fresh();function save(){localStorage.setItem('footSave',JSON.stringify(S))}function club(){return S.clubs[S.club]}function standings(){return [...S.clubs].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}function nav(){let items=['Início','Elenco','Escalação','Táticas','Classificação','Transferências','Finanças','Histórico'];document.getElementById('nav').innerHTML=items.map(x=>`<button onclick="page('${x}')">${x}</button>`).join('')}
function shell(title,body){document.getElementById('main').innerHTML=`<div class="head"><div><h1>${title}</h1><div class="muted">${S.started?club().n+' • Temporada '+S.season:'Nova carreira'}</div></div><button class="btn btn2" onclick="save();alert('Carreira salva neste dispositivo')">Salvar</button></div>${body}`}
function page(p){if(!S.started&&p!=='Início')return start();({Início:home,Elenco:squad,Escalação:lineup,Táticas:tactics,Classificação:league,Transferências:market,Finanças:finance,Histórico:history}[p]||home)()}
function start(){shell('Nova Carreira',`<div class="card"><div class="form"><label>Nome do treinador</label><input id="manager" value="${S.manager}"><label>Escolha o clube</label><select id="team">${S.clubs.map((c,i)=>`<option value="${i}">${c.n} • Força ${c.strength} • R$ ${c.budget} mi</option>`).join('')}</select><button class="btn" onclick="begin()">INICIAR CARREIRA</button></div></div>`)}function begin(){S.manager=document.getElementById('manager').value||'Treinador';S.club=+document.getElementById('team').value;S.started=true;S.news.unshift(`${S.manager} é o novo treinador do ${club().n}.`);save();home()}
function home(){let st=standings(),rank=st.findIndex(x=>x.id===club().id)+1,opp=S.clubs[(S.club+S.round+1)%S.clubs.length];shell('Painel do Treinador',`<div class="cards"><div class="card"><span class="muted">POSIÇÃO</span><div class="big">${rank}º</div></div><div class="card"><span class="muted">PONTOS</span><div class="big">${club().pts}</div></div><div class="card"><span class="muted">ORÇAMENTO</span><div class="big">R$ ${club().budget} mi</div></div><div class="card"><span class="muted">RODADA</span><div class="big">${S.round+1}</div></div></div><div class="row"><div class="card match"><div class="muted">PRÓXIMO JOGO</div><div class="score">${club().n} &nbsp; × &nbsp; ${opp.n}</div><button class="btn" onclick="playRound()">JOGAR PRÓXIMA RODADA</button></div><div class="card"><b>Notícias</b><div class="news">${S.news.slice(0,6).map(n=>`<div>${n}</div>`).join('')}</div></div></div>`)}
function goals(str){let x=Math.max(.2,(str-55)/18);return Math.min(6,Math.floor(Math.random()*x+Math.random()*x))}function game(a,b){let ga=goals(a.strength+2),gb=goals(b.strength);a.gf+=ga;a.ga+=gb;b.gf+=gb;b.ga+=ga;if(ga>gb){a.w++;b.l++;a.pts+=3}else if(gb>ga){b.w++;a.l++;b.pts+=3}else{a.d++;b.d++;a.pts++;b.pts++}return[ga,gb]}
function playRound(){if(S.round>=22)return endSeason();let used=new Set(),userResult='';for(let i=0;i<S.clubs.length;i++){if(used.has(i))continue;let j=(i+S.round+1)%S.clubs.length;if(j===i||used.has(j)){j=S.clubs.findIndex((_,k)=>k!==i&&!used.has(k))}if(j<0)continue;used.add(i);used.add(j);let r=game(S.clubs[i],S.clubs[j]);if(i===S.club||j===S.club)userResult=`${S.clubs[i].n} ${r[0]} x ${r[1]} ${S.clubs[j].n}`;}club().players.forEach(p=>{p.fit=Math.max(55,p.fit-rnd(2,8));if(Math.random()<.25){p.apps++;if(Math.random()<.08)p.goals++}})}S.round++;S.news.unshift(`Rodada ${S.round}: ${userResult}`);save();home()}
function squad(){let ps=[...club().players].sort((a,b)=>b.ov-a.ov);shell('Elenco',`<div class="card"><table class="table"><tr><th>JOGADOR</th><th>POS</th><th>IDADE</th><th>OVR</th><th>POT</th><th>VALOR</th><th>GOLS</th></tr>${ps.map(p=>`<tr><td>${p.n}</td><td><span class="pill">${p.p}</span></td><td>${p.age}</td><td><b>${p.ov}</b></td><td>${p.pot}</td><td>R$ ${p.value} mi</td><td>${p.goals}</td></tr>`).join('')}</table></div>`)}
function lineup(){let ps=[...club().players].sort((a,b)=>b.ov-a.ov).slice(0,11);shell('Escalação',`<div class="card"><h3>${S.formation}</h3>${ps.map((p,i)=>`<div class="player"><span>${i+1}. ${p.n} <span class="pill">${p.p}</span></span><b>${p.ov}</b></div><hr style="border-color:#1d3048">`).join('')}</div>`)}
function tactics(){shell('Táticas',`<div class="card form"><label>Formação</label><select onchange="S.formation=this.value;save()">${['4-4-2','4-3-3','4-2-3-1','3-5-2','3-4-3','5-3-2'].map(x=>`<option ${S.formation===x?'selected':''}>${x}</option>`)}</select><label>Mentalidade</label><select onchange="S.mentality=this.value;save()">${['Defensiva','Equilibrada','Ofensiva','Pressão alta','Contra-ataque'].map(x=>`<option ${S.mentality===x?'selected':''}>${x}</option>`)}</select></div>`)}
function league(){shell('Classificação',`<div class="card"><table class="table"><tr><th>#</th><th>CLUBE</th><th>PTS</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr>${standings().map((c,i)=>`<tr><td><span class="pos">${i+1}</span></td><td><b>${c.n}</b></td><td>${c.pts}</td><td>${c.w}</td><td>${c.d}</td><td>${c.l}</td><td>${c.gf}</td><td>${c.ga}</td><td>${c.gf-c.ga}</td></tr>`).join('')}</table></div>`)}
function market(){let pool=S.clubs.filter(c=>c.id!==S.club).flatMap(c=>c.players.map(p=>({...p,from:c.id}))).sort((a,b)=>b.ov-a.ov).slice(0,30);shell('Transferências',`<div class="card"><table class="table"><tr><th>JOGADOR</th><th>POS</th><th>OVR</th><th>IDADE</th><th>VALOR</th><th></th></tr>${pool.map(p=>`<tr><td>${p.n}</td><td>${p.p}</td><td>${p.ov}</td><td>${p.age}</td><td>R$ ${p.value} mi</td><td><button class="btn" onclick="buy('${p.id}',${p.from})">Contratar</button></td></tr>`).join('')}</table></div>`)}function buy(id,from){let seller=S.clubs[from],p=seller.players.find(x=>x.id===id);if(!p)return;if(club().budget<p.value)return alert('Orçamento insuficiente');club().budget-=p.value;seller.budget+=p.value;seller.players=seller.players.filter(x=>x.id!==id);club().players.push(p);S.news.unshift(`${club().n} contratou ${p.n} por R$ ${p.value} mi.`);save();market()}
function finance(){shell('Finanças',`<div class="cards"><div class="card"><div class="muted">SALDO</div><div class="big">R$ ${club().budget} mi</div></div><div class="card"><div class="muted">VALOR DO ELENCO</div><div class="big">R$ ${club().players.reduce((s,p)=>s+p.value,0)} mi</div></div><div class="card"><div class="muted">JOGADORES</div><div class="big">${club().players.length}</div></div></div>`)}function history(){shell('Histórico',`<div class="card"><div class="news">${S.history.length?S.history.map(x=>`<div>${x}</div>`).join(''):'Nenhuma temporada concluída.'}</div></div>`)}
function endSeason(){let champ=standings()[0];S.history.unshift(`${S.season}: ${champ.n} foi campeão com ${champ.pts} pontos.`);S.news.unshift(`${champ.n} é campeão da temporada ${S.season}!`);S.season++;S.round=0;S.clubs.forEach(c=>{c.pts=c.w=c.d=c.l=c.gf=c.ga=0;c.players.forEach(p=>{p.age++;p.fit=100;if(p.age<25&&p.ov<p.pot&&Math.random()<.55)p.ov++;if(p.age>31&&Math.random()<.45)p.ov=Math.max(45,p.ov-1)})});save();home()}
nav();S.started?home():start();</script></body></html>
